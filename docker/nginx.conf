# Reverse proxy + load balancer in front of the API replicas.
#
# "api" resolves through Docker's internal DNS: with
#   docker compose up --scale api=2
# it returns both container IPs and nginx round-robins between them —
# watch the X-Instance response header alternate.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 requests/second per client IP, small bursts allowed.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream rag_api {
        server api:8000;
    }

    server {
        listen 80;

        # Document uploads can be large
        client_max_body_size 50m;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://rag_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Parsing a big PDF or a slow model call may take a while
            proxy_read_timeout 300s;
        }
    }
}
