# The cluster's front door: routes outside HTTP traffic to the Service.
# Requires an ingress controller (e.g. ingress-nginx). On a local
# cluster it's simpler to skip this and use:
#   kubectl port-forward svc/rag-api 8080:8000
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api
                port:
                  number: 8000
