# Credentials live in a Secret, separate from plain config.
# Replace the placeholders before applying — or better, create it
# without a file:
#   kubectl create secret generic rag-secrets \
#     --from-literal=RAG_API_KEY=change-me \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
type: Opaque
stringData:
  RAG_API_KEY: "change-me"
  ANTHROPIC_API_KEY: ""
