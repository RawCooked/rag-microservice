[project]
name = "rag-microservice"
version = "0.1.0"
description = "State-of-the-art RAG microservice: multi-format ingestion, hybrid search + reranking, cited answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "docling>=2.122.0",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

# Docling needs torch — force the CPU-only wheels on every platform.
# The default Linux wheels ship CUDA (~2GB+ of GPU libraries) that CI
# machines and cheap cloud servers can't use anyway.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_core", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.extend-per-file-ignores]
# B008: `Depends(...)` in parameter defaults is FastAPI's intended idiom
"app/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
